<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poker Machine</title>
<style>
    body {
        background: #111;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 40px;
    }
    h1 { margin-bottom: 10px; }
    p { margin-top: 0; color: #ccc; }

    .slot-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 30px 0;
    }
    .slot {
        width: 120px;
        height: 120px;
        background: #222;
        border: 4px solid #555;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 50px;
        box-shadow: 0 0 15px #000;
    }

    button {
        padding: 15px 30px;
        font-size: 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #e63946;
        color: white;
        box-shadow: 0 0 10px #e63946aa;
        transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    button:active {
        transform: translateY(1px);
        box-shadow: 0 0 4px #e63946aa;
    }

    #message {
        margin-top: 20px;
        font-size: 24px;
        min-height: 30px;
    }
</style>
</head>
<body>

<h1>Sara's Totally Reel Poker Machine</h1>
<p>Match all 5 symbols to win. ⭐⭐⭐⭐⭐ triggers the JACKPOT PRIZE of a Booty Licking.</p>

<div class="slot-container">
    <div class="slot" id="slot1">?</div>
    <div class="slot" id="slot2">?</div>
    <div class="slot" id="slot3">?</div>
    <div class="slot" id="slot4">?</div>
    <div class="slot" id="slot5">?</div>
</div>

<button onclick="spin()">SPIN</button>
<div id="message"></div>

<script>
    const symbols = ["🍒", "🍋", "🔔", "💎", "⭐"];

    // How often ANY win happens (0.0 = never, 1.0 = always)
    let winChance = 0.25; // 25% of spins will be wins

    // Win distribution (must total 1.0)
    let chance2 = 0.60;        // 60% of wins are 2-symbol wins
    let chance3 = 0.25;        // 25% of wins are 3-symbol wins
    let chance4 = 0.10;        // 10% of wins are 4-symbol wins
    let chance5 = 0.04;        // 4% of wins are 5-symbol wins (non-jackpot)
    let jackpotChance = 0.01;  // 1% of wins are jackpot ⭐⭐⭐⭐⭐

    function chooseWinLength() {
        let r = Math.random();

        // Jackpot overrides everything
        if (r < jackpotChance) return 5.1; // special code for jackpot

        r -= jackpotChance;
        if (r < chance2) return 2;
        r -= chance2;
        if (r < chance3) return 3;
        r -= chance3;
        if (r < chance4) return 4;
        r -= chance4;
        if (r < chance5) return 5;

        return 2; // fallback
    }

    function spin() {
        const msg = document.getElementById("message");
        let results = [];

        // Decide if this spin is a winning spin
        const isWinningSpin = Math.random() < winChance;

        if (isWinningSpin) {
            // Pick a symbol to win with
            const winSymbol = symbols[Math.floor(Math.random() * symbols.length)];

            // Determine win length (2–5 or jackpot)
            let winLength = chooseWinLength();

            if (winLength === 5.1) {
                // Jackpot: force ⭐⭐⭐⭐⭐
                results = ["⭐","⭐","⭐","⭐","⭐"];
            } else {
                // Build normal win
                for (let i = 0; i < 5; i++) {
                    if (i < winLength) {
                        results.push(winSymbol);
                    } else {
                        // Fill remaining reels with random symbols (not the win symbol)
                        let s;
                        do {
                            s = symbols[Math.floor(Math.random() * symbols.length)];
                        } while (s === winSymbol);
                        results.push(s);
                    }
                }
            }
        } else {
            // Normal random spin (no forced win)
            for (let i = 0; i < 5; i++) {
                results.push(symbols[Math.floor(Math.random() * symbols.length)]);
            }
        }

        // Display symbols
        for (let i = 0; i < 5; i++) {
            document.getElementById("slot" + (i + 1)).textContent = results[i];
        }

        // Count left-to-right matches
        let matchCount = 1;
        for (let i = 1; i < results.length; i++) {
            if (results[i] === results[0]) matchCount++;
            else break;
        }

        // Determine win message
        if (matchCount >= 2) {
            if (matchCount === 5 && results[0] === "⭐") {
                msg.textContent = "JACKPOT! ⭐⭐⭐⭐⭐";
                msg.style.color = "#ffd700";
            } else {
                msg.textContent = `WIN! ${matchCount}× ${results[0]}!`;
                msg.style.color = "#00ff99";
            }
        } else {
            msg.textContent = "No win, try again";
            msg.style.color = "#fff";
        }
    }
</script>

<!-- ⭐⭐⭐ PAYOUT TABLE ADDED BELOW ⭐⭐⭐ -->

<div style="margin-top:40px; color:#ccc; font-size:18px;">
    <h2 style="color:white; margin-bottom:10px;">Payout Table</h2>
    <table style="margin:0 auto; border-collapse:collapse; font-size:18px;">
        <tr>
            <th style="border:1px solid #555; padding:8px;">Match</th>
            <th style="border:1px solid #555; padding:8px;">Prize</th>
        </tr>
        <tr>
            <td style="border:1px solid #555; padding:8px;">2 Matching Symbols</td>
            <td style="border:1px solid #555; padding:8px;">Small Win</td>
        </tr>
        <tr>
            <td style="border:1px solid #555; padding:8px;">3 Matching Symbols</td>
            <td style="border:1px solid #555; padding:8px;">Medium Win</td>
        </tr>
        <tr>
            <td style="border:1px solid #555; padding:8px;">4 Matching Symbols</td>
            <td style="border:1px solid #555; padding:8px;">Big Win</td>
        </tr>
        <tr>
            <td style="border:1px solid #555; padding:8px;">5 Matching Symbols</td>
            <td style="border:1px solid #555; padding:8px;">Huge Win</td>
        </tr>
        <tr>
            <td style="border:1px solid #555; padding:8px;">⭐⭐⭐⭐⭐</td>
            <td style="border:1px solid #555; padding:8px; color:#ffd700;">JACKPOT</td>
        </tr>
    </table>
</div>

</body>
</html>
