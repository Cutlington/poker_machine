<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poker Machine</title>
<style>
    body {
        background: #111;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 40px;
    }
    h1 {
        margin-bottom: 10px;
    }
    p {
        margin-top: 0;
        color: #ccc;
    }
    .slot-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 30px 0;
    }
    .slot {
        width: 120px;
        height: 120px;
        background: #222;
        border: 4px solid #555;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 50px;
        box-shadow: 0 0 15px #000;
    }
    button {
        padding: 15px 30px;
        font-size: 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #e63946;
        color: white;
        box-shadow: 0 0 10px #e63946aa;
        transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    button:active {
        transform: translateY(1px);
        box-shadow: 0 0 4px #e63946aa;
    }
    #message {
        margin-top: 20px;
        font-size: 24px;
        min-height: 30px;
    }
</style>
</head>
<body>
<h1>Simple Poker Machine</h1>
<p>Press SPIN to try your luck. Match all 3 symbols to win. Jackpot triggers on triple ⭐.</p>

<div class="slot-container">
    <div class="slot" id="slot1">?</div>
    <div class="slot" id="slot2">?</div>
    <div class="slot" id="slot3">?</div>
</div>

<button onclick="spin()">SPIN</button>
<div id="message"></div>

<script>
    const symbols = ["🍒", "🍋", "🔔", "💎", "⭐"]; // ⭐ = jackpot symbol

    function spin() {
        const s1 = symbols[Math.floor(Math.random() * symbols.length)];
        const s2 = symbols[Math.floor(Math.random() * symbols.length)];
        const s3 = symbols[Math.floor(Math.random() * symbols.length)];

        document.getElementById("slot1").textContent = s1;
        document.getElementById("slot2").textContent = s2;
        document.getElementById("slot3").textContent = s3;

        const msg = document.getElementById("message");

        if (s1 === s2 && s2 === s3) {
            if (s1 === "⭐") {
                msg.textContent = "JACKPOT! ⭐⭐⭐";
                msg.style.color = "#ffd700";
            } else {
                msg.textContent = "WIN! Triple " + s1;
                msg.style.color = "#00ff99";
            }
        } else {
            msg.textContent = "No win, try again";
            msg.style.color = "#fff";
        }
    }
</script>
</body>
</html>
