<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sara's Poker Machine</title>
<style>
    body {
        background: #111;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 40px;
    }
    h1 { margin-bottom: 10px; }
    p { margin-top: 0; color: #ccc; }

    .slot-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 30px 0;
    }
    .slot {
        width: 120px;
        height: 120px;
        background: #222;
        border: 4px solid #555;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 50px;
        box-shadow: 0 0 15px #000;
    }

    button {
        padding: 15px 30px;
        font-size: 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #e63946;
        color: white;
        box-shadow: 0 0 10px #e63946aa;
        transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    button:active {
        transform: translateY(1px);
        box-shadow: 0 0 4px #e63946aa;
    }

    #message {
        margin-top: 20px;
        font-size: 24px;
        min-height: 30px;
    }

    #balance {
        font-size: 26px;
        margin-bottom: 20px;
        color: #00eaff;
    }
</style>
</head>
<body>

<h1>Sara Totally Reel Poker Machine</h1>
<p>Match all 5 symbols to win. ⭐⭐⭐⭐⭐ = JACKPOT PRIZE of 1 Booty Licking From ME</p>

<div id="balance">Balance: $100</div>

<div class="slot-container">
    <div class="slot" id="slot1">?</div>
    <div class="slot" id="slot2">?</div>
    <div class="slot" id="slot3">?</div>
    <div class="slot" id="slot4">?</div>
    <div class="slot" id="slot5">?</div>
</div>

<button onclick="spin()">SPIN ($5)</button>
<div id="message"></div>

<script>
    const symbols = ["🍒", "🍋", "🔔", "💎", "⭐"];

    let balance = 100;
    const spinCost = 5;
    const winPayout = 50;
    const jackpotPayout = 500;

    function updateBalance() {
        document.getElementById("balance").textContent = "Balance: $" + balance;
    }

    function spin() {
        if (balance < spinCost) {
            document.getElementById("message").textContent = "You're out of money!";
            document.getElementById("message").style.color = "#ff4444";
            return;
        }

        balance -= spinCost;
        updateBalance();

        const results = [];

        for (let i = 1; i <= 5; i++) {
            const symbol = symbols[Math.floor(Math.random() * symbols.length)];
            results.push(symbol);
            document.getElementById("slot" + i).textContent = symbol;
        }

        const msg = document.getElementById("message");
        const allMatch = results.every(s => s === results[0]);

        if (allMatch) {
            if (results[0] === "⭐") {
                msg.textContent = "JACKPOT! ⭐⭐⭐⭐⭐ +$" + jackpotPayout;
                msg.style.color = "#ffd700";
                balance += jackpotPayout;
            } else {
                msg.textContent = "WIN! Five " + results[0] + " +$" + winPayout;
                msg.style.color = "#00ff99";
                balance += winPayout;
            }
        } else {
            msg.textContent = "No win, try again";
            msg.style.color = "#fff";
        }

        updateBalance();
    }
</script>

</body>
</html>
