<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poker Machine</title>
<style>
    body {
        background: #111;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 40px;
    }
    h1 { margin-bottom: 10px; }
    p { margin-top: 0; color: #ccc; }

    .slot-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 30px 0;
    }
    .slot {
        width: 120px;
        height: 120px;
        background: #222;
        border: 4px solid #555;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 50px;
        box-shadow: 0 0 15px #000;
    }

    button {
        padding: 15px 30px;
        font-size: 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #e63946;
        color: white;
        box-shadow: 0 0 10px #e63946aa;
        transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    button:active {
        transform: translateY(1px);
        box-shadow: 0 0 4px #e63946aa;
    }

    #message {
        margin-top: 20px;
        font-size: 24px;
        min-height: 30px;
    }
</style>
</head>
<body>

<h1>Sara's Totally Reel Poker Machine</h1>
<p>Match all 5 symbols to win. ⭐⭐⭐⭐⭐ triggers the JACKPOT PRIZE of a Booty Licking.</p>

<div class="slot-container">
    <div class="slot" id="slot1">?</div>
    <div class="slot" id="slot2">?</div>
    <div class="slot" id="slot3">?</div>
    <div class="slot" id="slot4">?</div>
    <div class="slot" id="slot5">?</div>
</div>

<button onclick="spin()">SPIN</button>
<div id="message"></div>

<script>
    const symbols = ["🍒", "🍋", "🔔", "💎", "⭐"]; // ⭐ = jackpot symbol

    function spin() {
        const results = [];

        // Generate 5 random symbols
        for (let i = 1; i <= 5; i++) {
            const symbol = symbols[Math.floor(Math.random() * symbols.length)];
            results.push(symbol);
            document.getElementById("slot" + i).textContent = symbol;
        }

        const msg = document.getElementById("message");

        // Check if all 5 match
        const allMatch = results.every(s => s === results[0]);

        if (allMatch) {
            if (results[0] === "⭐") {
                msg.textContent = "JACKPOT! ⭐⭐⭐⭐⭐";
                msg.style.color = "#ffd700";
            } else {
                msg.textContent = "WIN! Five " + results[0] + " in a row!";
                msg.style.color = "#00ff99";
            }
        } else {
            msg.textContent = "No win, try again";
            msg.style.color = "#fff";
        }
    }
</script>

</body>
</html>
