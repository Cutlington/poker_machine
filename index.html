<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poker Machine</title>
<style>
    body {
        background: #111;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 40px;
    }
    h1 { margin-bottom: 10px; }
    p { margin-top: 0; color: #ccc; }

    .slot-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 30px 0;
    }

    .reel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
    }

    .slot {
        width: 120px;
        height: 120px;
        background: #222;
        border: 4px solid #555;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 50px;
        box-shadow: 0 0 15px #000;
    }

    .ghost {
        width: 120px;
        height: 60px;
        background: #1a1a1a;
        border: 2px solid #333;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        opacity: 0.5;
    }

    button {
        padding: 15px 30px;
        font-size: 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #e63946;
        color: white;
        box-shadow: 0 0 10px #e63946aa;
        transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    button:active {
        transform: translateY(1px);
        box-shadow: 0 0 4px #e63946aa;
    }

    #message {
        margin-top: 20px;
        font-size: 24px;
        min-height: 30px;
    }
</style>
</head>
<body>

<h1>Sara's Totally Reel Poker Machine</h1>
<p>Match all 5 symbols to win. ⭐⭐⭐⭐⭐ triggers the JACKPOT PRIZE of a Booty Licking.</p>

<div class="slot-container">
    <div class="reel">
        <div class="ghost" id="g1a">?</div>
        <div class="slot" id="slot1">?</div>
        <div class="ghost" id="g1b">?</div>
    </div>
    <div class="reel">
        <div class="ghost" id="g2a">?</div>
        <div class="slot" id="slot2">?</div>
        <div class="ghost" id="g2b">?</div>
    </div>
    <div class="reel">
        <div class="ghost" id="g3a">?</div>
        <div class="slot" id="slot3">?</div>
        <div class="ghost" id="g3b">?</div>
    </div>
    <div class="reel">
        <div class="ghost" id="g4a">?</div>
        <div class="slot" id="slot4">?</div>
        <div class="ghost" id="g4b">?</div>
    </div>
    <div class="reel">
        <div class="ghost" id="g5a">?</div>
        <div class="slot" id="slot5">?</div>
        <div class="ghost" id="g5b">?</div>
    </div>
</div>

<button onclick="spin()">SPIN</button>
<div id="message"></div>

<script>
    const symbols = ["🍒", "🍋", "🔔", "💎", "⭐"];

    let winChance = 0.25;

    let chance2 = 0.60;
    let chance3 = 0.25;
    let chance4 = 0.10;
    let chance5 = 0.04;
    let jackpotChance = 0.01;

    function chooseWinLength() {
        let r = Math.random();
        if (r < jackpotChance) return 5.1;
        r -= jackpotChance;
        if (r < chance2) return 2;
        r -= chance2;
        if (r < chance3) return 3;
        r -= chance3;
        if (r < chance4) return 4;
        r -= chance4;
        if (r < chance5) return 5;
        return 2;
    }

    function flickerReels(duration = 300) {
        return new Promise(resolve => {
            const interval = setInterval(() => {
                for (let i = 1; i <= 5; i++) {
                    document.getElementById("slot" + i).textContent =
                        symbols[Math.floor(Math.random() * symbols.length)];
                    document.getElementById("g" + i + "a").textContent =
                        symbols[Math.floor(Math.random() * symbols.length)];
                    document.getElementById("g" + i + "b").textContent =
                        symbols[Math.floor(Math.random() * symbols.length)];
                }
            }, 50);

            setTimeout(() => {
                clearInterval(interval);
                resolve();
            }, duration);
        });
    }

    async function spin() {
        const msg = document.getElementById("message");
        msg.textContent = "";

        // Flicker animation before showing real results
        await flickerReels();

        let results = [];
        const isWinningSpin = Math.random() < winChance;

        if (isWinningSpin) {
            const winSymbol = symbols[Math.floor(Math.random() * symbols.length)];
            let winLength = chooseWinLength();

            if (winLength === 5.1) {
                results = ["⭐","⭐","⭐","⭐","⭐"];
            } else {
                for (let i = 0; i < 5; i++) {
                    if (i < winLength) {
                        results.push(winSymbol);
                    } else {
                        let s;
                        do {
                            s = symbols[Math.floor(Math.random() * symbols.length)];
                        } while (s === winSymbol);
                        results.push(s);
                    }
                }
            }
        } else {
            for (let i = 0; i < 5; i++) {
                results.push(symbols[Math.floor(Math.random() * symbols.length)]);
            }
        }

        // Display final symbols + above/below
        for (let i = 0; i < 5; i++) {
            const main = results[i];
            const above = symbols[Math.floor(Math.random() * symbols.length)];
            const below = symbols[Math.floor(Math.random() * symbols.length)];

            document.getElementById("slot" + (i + 1)).textContent = main;
            document.getElementById("g" + (i + 1) + "a").textContent = above;
            document.getElementById("g" + (i + 1) + "b").textContent = below;
        }

        // Count left-to-right matches
        let matchCount = 1;
        for (let i = 1; i < results.length; i++) {
            if (results[i] === results[0]) matchCount++;
            else break;
        }

        if (matchCount >= 2) {
            if (matchCount === 5 && results[0] === "⭐") {
                msg.textContent = "JACKPOT! ⭐⭐⭐⭐⭐";
                msg.style.color = "#ffd700";
            } else {
                msg.textContent = `WIN! ${matchCount}× ${results[0]}!`;
                msg.style.color = "#00ff99";
            }
        } else {
            msg.textContent = "No win, try again";
            msg.style.color = "#fff";
        }
    }
</script>

</body>
</html>
